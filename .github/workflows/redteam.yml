name: Red team

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly drift check. Models change under you; the agent does not have to
    # for last month's green scan to stop being true.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # The fast gate. No secrets, no network, no spend — so it also runs on forks
  # and tells you within a minute if the harness itself is broken.
  selfcheck:
    name: Offline self-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run offline self-checks
        run: python -m pytest tests/ -q

      - name: Confirm the target refuses to bind publicly
        run: |
          # timeout guards the failure case: if the refusal ever regresses,
          # uvicorn would bind and serve forever instead of failing the step.
          if AGENT_HOST=0.0.0.0 timeout 30 python -m target_agent.app 2>&1 | grep -q "Refusing to bind"; then
            echo "OK: target refuses non-loopback binds"
          else
            echo "FAIL: target did not refuse a non-loopback bind" >&2
            exit 1
          fi

  scan:
    name: Hardened red team scan
    runs-on: ubuntu-latest
    needs: selfcheck
    # Forked PRs cannot read secrets, so the scan would fail for reasons that
    # have nothing to do with the change. selfcheck still gates those.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Run the scan in hardened mode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_HARDENED: "true"
        run: ./scripts/run_scan.sh --hardened --output output/results.json

      # Always upload, especially on failure — the artifact is how you find out
      # which probe got through.
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-results-${{ github.run_id }}
          path: |
            output/results.json
            logs/tool_calls.jsonl
          retention-days: 30
          if-no-files-found: warn

      - name: Enforce the severity gate
        run: |
          # The spec asks for a gate on critical-severity plugins. In promptfoo
          # 0.123.0 none of the plugins this POC configures actually map to
          # `critical` — the most severe are `high` (rbac, bola, bfla, ssrf,
          # pii, sql-injection, hijacking, indirect-prompt-injection, policy).
          # Gating on critical alone would therefore never fail, so `high` is
          # included and the gate has teeth. Widen or narrow to taste.
          python scripts/summarize.py output/results.json \
            --fail-on-severity critical,high

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Red team scan (hardened)'
            echo
            echo '```'
            python scripts/summarize.py output/results.json 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
